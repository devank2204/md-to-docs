name: CI

on:
  push:
    branches: [main, master, v1, v3]
  pull_request:
    branches: [main, master, v1, v3]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, Build & Prerender Monorepo
        run: pnpm build

      - name: Run Validation Unit Tests (Vitest)
        run: pnpm --filter @mdtodocs/validation test

      - name: Run Fidelity Lab Golden Regression Harness
        run: pnpm --filter @mdtodocs/fidelity-lab test

      - name: Lint Web Application
        run: pnpm --filter web lint

      - name: Install browser for interaction tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Mobile and desktop browser regressions
        run: pnpm test:browser

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.os }}
          path: test-results/
